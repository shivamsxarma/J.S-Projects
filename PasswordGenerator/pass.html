<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="pass.css">
        <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

</head>
<body>
    <div class="container">
        <br> 
        <br> 
        <!-- <h1>Password Generator</h1> -->
        <!-- <div class="inputBox">
            <input type="text" class="passBox" disabled>
        </div> -->
<div class="brutalist-container">
  <input
    placeholder="will get back to you"
    class="brutalist-input smooth-type"
    type="text"
    disabled
    id="passBox"
  />
    <span class="material-icons" id="copyIcon">content_copy</span>
  <label class="brutalist-label">PASSWORD GENERATOR </label>
</div>

<br> 

        <input type="range" min="1" max="30" value="8" id="inputSlider">

       <div class="row">
           <p> Password Length</p>
        <span id="sliderValue"></span>
       </div>
       <br> 
    <div class="row">
        <label for="lowercase">Include Lowercase Letters(a-z) </label>
     <input type="checkbox" name="lowercase " id="lowercase">
    </div>
<br> 
    <div class="row">
        <label for="uppercase">Include Uppercase Letters(a-z) </label>
     <input type="checkbox" name="uppercase " id="uppercase">
    </div>
<br> 
    <div class="row">
        <label for="numbers">Include Numbers Letters(0-9) </label>
     <input type="checkbox" name="numbers " id="numbers">
    </div>
<br> 
    <div class="row">
        <label for="symbols">Include Symbols Letters(!,@,#,$,%,^,&,*,_) </label>
     <input type="checkbox" name="symbols " id="symbols">
    </div>

    <!-- <button type="button" class="genBtn">Generate Password</button>
      -->

      <br>
      <br> 
      <button class="btn cube cube-hover" type="button " id="genBtn">
  <div class="bg-top">
    <div class="bg-inner"></div>
  </div>
  <div class="bg-right">
    <div class="bg-inner"></div>
  </div>
  <div class="bg">
    <div class="bg-inner"></div>
  </div>
  <div class="text">Generate Password</div>
</button>


    </div>
   <script src="pass.js"></script> 
</body>
</html>
