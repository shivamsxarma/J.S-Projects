<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');



*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
      font-family: "Oswald", sans-serif;

}

body{
    width: 100%;
    height: 100vh;
    display: flex;
 align-items: center;
    justify-content: center;
background: linear-gradient(to right, #d3cbb8, #6d6027);;

}

.calculator{
    border: 2px solid #f6f2f2 ;
    padding: 20px;
    border-radius: 16px;
    background-color: transparent;
    box-shadow: 0px 3px 15px rgba(21, 21, 21, 0.5);
}

input{
    width: 320px;
    border: 2px solid #e2dcdc ;
    border-radius: 16px;
    padding: 24px;
    margin: 10px;
    background:transparent ;
    box-shadow:0px 3px 15px rgba(84 , 84 , 84, 0.1) ;
    font-size: 40px;
    text-align: right;
    cursor: pointer;

}

input::placeholder{
    color: white;
}

button{
    border: none;
    width: 60px;
    height: 60px;
    margin: 10px;
    border-radius: 50% ;
    background: transparent;
    color: white;
    font-size: 20px ;
    box-shadow: -8px 8px 15px rgba(0, 3, 8, 0.4);
    cursor: pointer;
}

</style>
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" id="inputBox">
        <div>
            <button>AC</button>
            <button>DEL</button>
            <button>%</button>
            <button>/</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalbtn">=</button>
        </div>
    </div>

    <script> let input = document.getElementById('inputBox');
let buttons = document.querySelectorAll('button');

let string = "";
let arr = Array.from(buttons);
arr.forEach(button => {
    button.addEventListener('click' , (e) =>{
        if(e.target.innerHTML == '='){
            string = eval(string);
            input.value = string;
        }
        else if (e.target.innerHTML == 'AC'){
            string = "";
            input.value = string;
        }

        else if (e.target.innerHTML == 'DEL'){
            string = string.substring(0,string.length-1);
            input.value = string;
        }

        else{
       string += e.target.innerHTML;
        input.value = string;
        }
 
    })
})                                   </script>
</body>
</html>
